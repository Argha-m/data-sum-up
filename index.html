<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Data Summary</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container py-5">
      <div class="row justify-content-center">
        <div class="col-md-6">
          <div class="card shadow-sm border-dashed border-dark rounded-3">
            <div class="card-body p-4">
              <h2 class="card-title mb-4 text-center fw-semibold">
                Upload Data File
              </h2>

              <div class="mb-3">
                <label for="excelFile" class="form-label"
                  >Choose an Excel or CSV file</label
                >
                <input
                  class="form-control form-control-lg"
                  type="file"
                  id="excelFile"
                  accept=".xlsx,.xls,.csv"
                />
              </div>

              <div class="d-grid gap-2 d-md-flex">
                <button
                  class="btn btn-primary btn-lg"
                  type="button"
                  id="uploadBtn"
                  onclick="uploadFile()"
                >
                  <i class="bi bi-upload me-2"></i>
                  Upload
                </button>
                <button
                  class="btn btn-primary btn-lg"
                  type="button"
                  id="clearBtn"
                  onclick="clearFile()"
                >
                  <i class="bi bi-trash me-2"></i>
                  Clear
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="row data-summary-row justify-content-center mt-5">
        <div class="col-md-10">
          <div class="card shadow-sm border-dashed border-dark rounded-3">
            <div class="card-body p-4">
              <h2 class="card-title mb-4 text-center fw-semibold">
                Data Summary
              </h2>
              <div class="table-responsive">
                <table class="table table-bordered table-hover">
                  <thead class="table-primary">
                    <tr>
                      <th>Date</th>
                      <th>Download</th>
                      <th>Upload</th>
                      <th>Session Time</th>
                    </tr>
                  </thead>
                  <tbody id="dataTableBody"></tbody>
                </table>
              </div>
              <div class="d-grid mt-3">
                <button
                  class="btn btn-primary btn-lg"
                  type="button"
                  id="downloadSummaryBtn"
                  onclick="downloadSummary()"
                >
                  <i class="bi bi-download me-2"></i>
                  Download Summary
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
